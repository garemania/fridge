<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>냉장고</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="냉장고">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --sep:rgba(60,60,67,.22);
  --l1:#000; --l2:rgba(60,60,67,.6); --l3:rgba(60,60,67,.3);
  --fill:rgba(118,118,128,.12);
  --green:#248A3D; --orange:#C25E00; --red:#D70015; --blue:#007AFF;
  --sheet:#F2F2F7;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --card:#1C1C1E; --sep:rgba(84,84,88,.6);
    --l1:#fff; --l2:rgba(235,235,245,.6); --l3:rgba(235,235,245,.3);
    --fill:rgba(118,118,128,.24);
    --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --blue:#0A84FF;
    --sheet:#1C1C1E;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior-y:none}
body{
  background:var(--bg);color:var(--l1);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo",system-ui,"Noto Sans KR",sans-serif;
  font-size:17px;line-height:1.35;letter-spacing:-.01em;
  padding-bottom:calc(104px + env(safe-area-inset-bottom));
}
button,input{font-family:inherit;color:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

header{padding:calc(14px + env(safe-area-inset-top)) 20px 6px}
h1{font-size:34px;font-weight:700;letter-spacing:-.037em;margin:0}
.sub{color:var(--l2);font-size:15px;margin:2px 0 0}

.searchwrap{padding:12px 16px 6px}
.search{display:flex;align-items:center;gap:7px;background:var(--fill);border-radius:10px;padding:8px 10px}
.search svg{flex:0 0 16px;opacity:.45}
.search input{flex:1;border:0;background:transparent;font-size:17px;padding:0;min-width:0}
.search input::placeholder{color:var(--l2)}
.sclear{border:0;background:transparent;color:var(--l2);font-size:17px;padding:0 2px;display:none}

.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:10px 16px 16px}
.seg button{
  flex:1;border:0;background:transparent;border-radius:7px;
  padding:7px 0;font-size:13px;font-weight:600;color:var(--l1);
  transition:background .18s,box-shadow .18s;
}
.seg button[aria-selected="true"]{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.09)}

.group{background:var(--card);border-radius:12px;margin:0 16px;overflow:hidden}
.row{position:relative;overflow:hidden;background:var(--red)}
.rowbg{position:absolute;inset:0;display:flex;align-items:center;padding-left:22px;color:#fff;font-size:15px;font-weight:600}
.rowfg{
  position:relative;display:flex;align-items:center;gap:12px;
  background:var(--card);padding:9px 14px 9px 16px;
  touch-action:pan-y;will-change:transform;cursor:pointer;
}
.row:not(:last-child) .rowfg::after{
  content:"";position:absolute;left:68px;right:0;bottom:0;height:.5px;background:var(--sep);
}
.rowfg:active{background:var(--fill)}
.av{
  width:40px;height:40px;border-radius:9px;flex:0 0 40px;object-fit:cover;
  background:var(--fill);display:grid;place-items:center;font-size:21px;
}
.meta{flex:1;min-width:0}
.nm{font-size:17px;letter-spacing:-.022em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{font-size:13px;color:var(--l2);margin-top:1px;font-variant-numeric:tabular-nums}
.dd{font-size:15px;font-variant-numeric:tabular-nums;flex:0 0 auto;text-align:right}
.chev{flex:0 0 8px;color:var(--l3);font-size:17px;margin-left:2px}

.empty{text-align:center;color:var(--l2);padding:64px 40px;font-size:15px;line-height:1.6;white-space:pre-line}

.fab{
  position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;border:0;background:var(--blue);color:#fff;
  font-size:31px;font-weight:300;line-height:1;cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.22);
}
.fab:active{transform:scale(.94)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;top:36px;background:var(--sheet);
  border-radius:12px 12px 0 0;overflow-y:auto;overscroll-behavior:contain;
  transform:translateY(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -1px 20px rgba(0,0,0,.2);
}
.sheet.on{transform:translateY(0)}
.nav{
  position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;background:var(--sheet);border-bottom:.5px solid var(--sep);
}
.nav b{font-size:17px;font-weight:600}
.nav button{border:0;background:transparent;font-size:17px;color:var(--blue);padding:0;cursor:pointer}
.nav button.done{font-weight:600}
.nav button:disabled{color:var(--l3)}
.body{padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
.lab{font-size:13px;color:var(--l2);margin:0 0 7px 4px}
.field{margin-bottom:22px}
.tf{width:100%;background:var(--card);border:0;border-radius:10px;padding:13px 14px;font-size:17px;letter-spacing:-.022em}
#exp{font-variant-numeric:tabular-nums;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:0;background:var(--card);border-radius:9px;padding:9px 13px;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff}
.chip.ic{font-size:20px;padding:7px 10px;line-height:1.1}
.quick{display:flex;gap:7px;margin-top:9px}
.quick button{flex:1;border:0;background:var(--card);border-radius:9px;padding:9px 0;font-size:14px;cursor:pointer}
.stepper{display:flex;align-items:center;background:var(--card);border-radius:10px;overflow:hidden;width:fit-content}
.stepper button{border:0;background:transparent;width:52px;padding:11px 0;font-size:21px;cursor:pointer}
.stepper span{min-width:46px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.shots{display:flex;gap:9px;align-items:center}
.shot{flex:1;border:0;background:var(--card);border-radius:10px;padding:13px 6px;font-size:15px;cursor:pointer}
#prev{width:56px;height:56px;border-radius:10px;object-fit:cover;display:none;flex:0 0 56px}
.hint{font-size:13px;color:var(--l2);margin:8px 0 0 4px;min-height:17px}
.danger{width:100%;border:0;background:var(--card);color:var(--red);border-radius:10px;padding:14px;font-size:17px;cursor:pointer;margin-top:6px}

.toast{
  position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));
  background:rgba(28,28,30,.96);color:#fff;border-radius:13px;
  padding:13px 16px;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s;
}
.toast.on{opacity:1;transform:translateY(0);pointer-events:auto}
.toast button{border:0;background:transparent;color:#4DA3FF;font-size:15px;font-weight:600;cursor:pointer;flex:0 0 auto}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <h1>냉장고</h1>
  <p class="sub" id="sub">불러오는 중</p>
</header>

<div class="searchwrap">
  <label class="search">
    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M11.7 10.3a5.5 5.5 0 10-1.4 1.4l3.3 3.3a1 1 0 001.4-1.4l-3.3-3.3zM3 6.5a3.5 3.5 0 117 0 3.5 3.5 0 01-7 0z"/></svg>
    <input type="search" id="q" placeholder="검색" autocomplete="off" enterkeyhint="search">
    <button class="sclear" id="qx" aria-label="검색어 지우기">✕</button>
  </label>
</div>

<div class="seg" role="tablist">
  <button role="tab" data-f="all" aria-selected="true">전체</button>
  <button role="tab" data-f="soon" aria-selected="false">임박</button>
  <button role="tab" data-f="gone" aria-selected="false">지남</button>
</div>

<div id="list"></div>

<button class="fab" id="fab" aria-label="식품 추가">+</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="식품 정보">
  <div class="nav">
    <button id="cancel">취소</button>
    <b id="sTitle">넣기</b>
    <button class="done" id="done" disabled>완료</button>
  </div>
  <div class="body">

    <div class="field">
      <div class="lab">사진</div>
      <div class="shots">
        <button class="shot" id="bCam">📷 사진 찍기</button>
        <button class="shot" id="bAlb">🖼 앨범</button>
        <img id="prev" alt="">
      </div>
      <input type="file" id="fCam" accept="image/*" capture="environment" hidden>
      <input type="file" id="fAlb" accept="image/*" hidden>
      <div class="hint" id="aiStat"></div>
    </div>

    <div class="field">
      <div class="lab">이름</div>
      <input type="text" class="tf" id="name" placeholder="예: 대파, 삼겹살" autocomplete="off">
    </div>

    <div class="field">
      <div class="lab">보관 위치</div>
      <div class="chips" id="places"></div>
    </div>

    <div class="field">
      <div class="lab">종류</div>
      <div class="chips" id="cats"></div>
    </div>

    <div class="field">
      <div class="lab">유통기한</div>
      <input type="text" class="tf" id="exp" inputmode="numeric" placeholder="20260907" maxlength="8" autocomplete="off">
      <div class="quick">
        <button data-d="1">내일</button>
        <button data-d="3">3일</button>
        <button data-d="7">1주</button>
        <button data-d="30">1달</button>
      </div>
      <div class="hint" id="expHint">숫자 8자리로 직접 입력할 수 있습니다</div>
    </div>

    <div class="field">
      <div class="lab">수량</div>
      <div class="stepper">
        <button id="qtyM" aria-label="수량 줄이기">−</button>
        <span id="qty">1</span>
        <button id="qtyP" aria-label="수량 늘리기">+</button>
      </div>
    </div>

    <div class="field">
      <div class="lab">아이콘</div>
      <div class="chips" id="icons"></div>
    </div>

    <button class="danger" id="del" hidden>꺼내기</button>
  </div>
</div>

<div class="toast" id="toast"><span id="tmsg"></span><button id="tact" hidden>실행취소</button></div>

<script>
const CATS=[
 {k:'잎채소',e:'🥬',d:5},{k:'뿌리채소',e:'🥕',d:14},{k:'과일',e:'🍎',d:7},
 {k:'육류',e:'🥩',d:3},{k:'해산물',e:'🐟',d:2},{k:'유제품',e:'🥛',d:7},
 {k:'계란',e:'🥚',d:21},{k:'두부·콩',e:'🫘',d:5},{k:'반찬',e:'🥘',d:3},
 {k:'빵',e:'🍞',d:4},{k:'냉동식품',e:'🧊',d:90},{k:'양념',e:'🧂',d:180},
 {k:'음료',e:'🧃',d:14},{k:'기타',e:'📦',d:7}
];
const ICONS=['🥬','🥕','🧅','🍅','🥦','🌽','🍎','🍌','🍓','🍇','🥩','🍗','🐟','🦐','🥚','🥛','🧀','🧈','🫘','🍚','🥘','🍜','🍞','🧊','🧂','🍶','🧃','☕','🍫','📦'];
const PLACES=['냉장','냉동','실온'];
const KEY='fridge-items';

/* 인식 서버 주소. 비워두면 수동 입력만 됩니다. */
const WORKER='';

let items=[],filter='all',query='',editing=null,undoItem=null;
let draft={img:null,cat:null,icon:null,place:'냉장',qty:1};

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const ymd=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
const plus=n=>{const d=today();d.setDate(d.getDate()+n);return ymd(d)};
const pretty=s=>s?`${+s.slice(4,6)}월 ${+s.slice(6,8)}일`:'';
function left(s){
  if(!s||s.length!==8)return null;
  const y=+s.slice(0,4),m=+s.slice(4,6),dd=+s.slice(6,8);
  if(m<1||m>12||dd<1||dd>31)return null;
  const d=new Date(y,m-1,dd);
  if(d.getMonth()!==m-1)return null;
  return Math.round((d-today())/864e5);
}
const HAS_WS=typeof window.storage!=='undefined';

/* ---------- 저장 ---------- */
async function load(){
  try{
    if(HAS_WS){const r=await window.storage.get(KEY);items=r?JSON.parse(r.value):[]}
    else{items=JSON.parse(localStorage.getItem(KEY)||'[]')}
  }catch(e){items=[]}
  render();
}
let st=null;
function save(){
  clearTimeout(st);
  st=setTimeout(async()=>{
    try{
      const v=JSON.stringify(items);
      if(HAS_WS)await window.storage.set(KEY,v);
      else localStorage.setItem(KEY,v);
    }catch(e){toast('저장 공간이 부족합니다. 오래된 항목을 꺼내주세요')}
  },250);
}

/* ---------- 목록 ---------- */
function render(){
  const host=$('list');host.innerHTML='';
  const all=items.map(i=>({...i,n:left(i.exp)}))
    .sort((a,b)=>(a.n===null)-(b.n===null)||a.n-b.n);

  const soon=all.filter(i=>i.n!==null&&i.n>=0&&i.n<=3).length;
  const gone=all.filter(i=>i.n!==null&&i.n<0).length;
  $('sub').textContent=all.length
    ? `${all.length}개 보관 중`+(soon?` · 임박 ${soon}`:'')+(gone?` · 지남 ${gone}`:'')
    : '아직 비어 있습니다';

  const q=query.trim();
  const view=all.filter(i=>{
    const okF=filter==='all'||(filter==='soon'&&i.n!==null&&i.n>=0&&i.n<=3)||(filter==='gone'&&i.n!==null&&i.n<0);
    const okQ=!q||i.name.includes(q)||(i.cat||'').includes(q)||(i.place||'').includes(q);
    return okF&&okQ;
  });

  if(!view.length){
    const p=document.createElement('p');p.className='empty';
    p.textContent=q?'검색 결과가 없습니다.'
      :filter==='all'?'냉장고가 비어 있습니다.\n오른쪽 아래 + 를 눌러 넣어보세요.'
      :'해당하는 식품이 없습니다.';
    host.appendChild(p);return;
  }
  const g=document.createElement('div');g.className='group';
  view.forEach(it=>g.appendChild(rowEl(it)));
  host.appendChild(g);
}

function rowEl(it){
  const c=CATS.find(x=>x.k===it.cat)||CATS[13];
  const tone=it.n===null?'var(--l2)':it.n<0?'var(--red)':it.n<=3?'var(--orange)':'var(--l2)';

  const wrap=document.createElement('div');wrap.className='row';
  const bg=document.createElement('div');bg.className='rowbg';bg.textContent='밀어서 꺼내기';
  const fg=document.createElement('div');fg.className='rowfg';

  let av;
  if(it.img){av=document.createElement('img');av.className='av';av.src=it.img;av.alt=''}
  else{av=document.createElement('div');av.className='av';av.textContent=it.icon||c.e}

  const meta=document.createElement('div');meta.className='meta';
  const nm=document.createElement('div');nm.className='nm';
  nm.textContent=it.name+((it.qty||1)>1?` ×${it.qty}`:'');
  const sb=document.createElement('div');sb.className='sb';
  sb.textContent=[it.place||'냉장',c.k,it.exp?pretty(it.exp):'기한 없음'].join(' · ');
  meta.append(nm,sb);

  const dd=document.createElement('div');dd.className='dd';dd.style.color=tone;
  dd.textContent=it.n===null?'—':it.n<0?`${-it.n}일 지남`:it.n===0?'오늘까지':`D-${it.n}`;

  const ch=document.createElement('div');ch.className='chev';ch.textContent='›';

  fg.append(av,meta,dd,ch);wrap.append(bg,fg);
  bind(wrap,fg,it);
  return wrap;
}

/* 오른쪽으로 밀면 꺼내기, 누르면 수정 */
function bind(wrap,fg,it){
  let x0=0,y0=0,dx=0,on=false,lock=null,moved=false;
  fg.addEventListener('pointerdown',e=>{
    on=true;lock=null;moved=false;x0=e.clientX;y0=e.clientY;dx=0;
    fg.style.transition='none';fg.setPointerCapture(e.pointerId);
  });
  fg.addEventListener('pointermove',e=>{
    if(!on)return;
    const mx=e.clientX-x0,my=e.clientY-y0;
    if(lock===null){
      if(Math.abs(mx)<6&&Math.abs(my)<6)return;
      lock=Math.abs(mx)>Math.abs(my)?'x':'y';
    }
    if(lock!=='x')return;
    moved=true;dx=Math.max(0,mx);
    fg.style.transform=`translateX(${dx}px)`;
  });
  const end=()=>{
    if(!on)return;on=false;
    fg.style.transition='transform .3s cubic-bezier(.32,.72,0,1)';
    if(!moved){fg.style.transform='translateX(0)';openSheet(it);return}
    if(dx>Math.min(140,wrap.offsetWidth*.4)){
      fg.style.transform=`translateX(${wrap.offsetWidth}px)`;
      wrap.style.transition='height .22s ease,opacity .22s';
      wrap.style.height=wrap.offsetHeight+'px';
      requestAnimationFrame(()=>{wrap.style.height='0px';wrap.style.opacity='0'});
      setTimeout(()=>remove(it.id),220);
    }else fg.style.transform='translateX(0)';
  };
  fg.addEventListener('pointerup',end);
  fg.addEventListener('pointercancel',end);
}

function remove(id){
  const i=items.findIndex(x=>x.id===id);
  if(i<0)return;
  undoItem={item:items[i],at:i};
  items.splice(i,1);save();render();
  toast(`${undoItem.item.name} 꺼냄`,()=>{
    if(!undoItem)return;
    items.splice(undoItem.at,0,undoItem.item);undoItem=null;save();render();
  });
}

/* ---------- 선택 칩 ---------- */
function pressOnly(host,btn){
  [...host.children].forEach(x=>x.setAttribute('aria-pressed','false'));
  if(btn)btn.setAttribute('aria-pressed','true');
}
PLACES.forEach(p=>{
  const b=document.createElement('button');
  b.className='chip';b.type='button';b.textContent=p;
  b.setAttribute('aria-pressed',p==='냉장'?'true':'false');
  b.onclick=()=>{
    draft.place=p;pressOnly($('places'),b);
    if(draft.cat){
      const c=CATS.find(x=>x.k===draft.cat);
      const days=p==='냉동'?90:c.d;
      $('exp').value=plus(days);
      $('expHint').textContent=`${p==='냉동'?'냉동':c.k} 기준 ${days}일`;
    }
    check();
  };
  $('places').appendChild(b);
});
CATS.forEach(c=>{
  const b=document.createElement('button');
  b.className='chip';b.type='button';b.setAttribute('aria-pressed','false');
  b.textContent=`${c.e} ${c.k}`;
  b.onclick=()=>{
    draft.cat=c.k;pressOnly($('cats'),b);
    const days=draft.place==='냉동'?90:c.d;
    $('exp').value=plus(days);
    $('expHint').textContent=`${draft.place==='냉동'?'냉동':c.k} 기준 ${days}일`;
    if(!draft.icon){
      const hit=[...$('icons').children].find(x=>x.textContent===c.e);
      if(hit)hit.click();
    }
    check();
  };
  $('cats').appendChild(b);
});
ICONS.forEach(ic=>{
  const b=document.createElement('button');
  b.className='chip ic';b.type='button';b.setAttribute('aria-pressed','false');
  b.textContent=ic;
  b.onclick=()=>{draft.icon=ic;pressOnly($('icons'),b)};
  $('icons').appendChild(b);
});
document.querySelectorAll('.quick button').forEach(b=>{
  b.onclick=()=>{$('exp').value=plus(+b.dataset.d);$('expHint').textContent='';check()};
});
$('qtyM').onclick=()=>{draft.qty=Math.max(1,draft.qty-1);$('qty').textContent=draft.qty};
$('qtyP').onclick=()=>{draft.qty=Math.min(99,draft.qty+1);$('qty').textContent=draft.qty};

/* ---------- 시트 ---------- */
function openSheet(it){
  editing=it||null;
  draft={
    img:it?it.img:null, cat:it?it.cat:null, icon:it?it.icon:null,
    place:it?(it.place||'냉장'):'냉장', qty:it?(it.qty||1):1
  };

  $('sTitle').textContent=it?'수정':'넣기';
  $('del').hidden=!it;
  $('name').value=it?it.name:'';
  $('exp').value=it&&it.exp?it.exp:'';
  $('qty').textContent=draft.qty;
  $('aiStat').textContent='';
  $('expHint').textContent='숫자 8자리로 직접 입력할 수 있습니다';

  if(draft.img){$('prev').src=draft.img;$('prev').style.display='block'}
  else $('prev').style.display='none';

  pressOnly($('places'),[...$('places').children].find(x=>x.textContent===draft.place));
  pressOnly($('cats'),draft.cat?[...$('cats').children].find(x=>x.textContent.endsWith(draft.cat)):null);
  pressOnly($('icons'),draft.icon?[...$('icons').children].find(x=>x.textContent===draft.icon):null);

  check();
  $('scrim').classList.add('on');$('sheet').classList.add('on');
}
function closeSheet(){$('scrim').classList.remove('on');$('sheet').classList.remove('on');editing=null}
$('fab').onclick=()=>openSheet(null);
$('cancel').onclick=closeSheet;
$('scrim').onclick=closeSheet;

$('del').onclick=()=>{const id=editing&&editing.id;closeSheet();if(id)remove(id)};

$('done').onclick=()=>{
  const v=$('exp').value;
  if(v.length===8&&left(v)===null){toast('날짜를 확인해주세요');return}
  const data={
    name:$('name').value.trim()||draft.cat||'이름 없음',
    cat:draft.cat||'기타',
    exp:v.length===8?v:'',
    img:draft.img,icon:draft.icon,place:draft.place,qty:draft.qty
  };
  if(editing){
    const i=items.findIndex(x=>x.id===editing.id);
    if(i>=0)items[i]={...items[i],...data};
    toast('수정했습니다');
  }else{
    items.push({id:Date.now()+''+Math.random().toString(36).slice(2,6),...data});
    toast('넣었습니다');
  }
  save();render();closeSheet();
};

$('name').addEventListener('input',check);
$('exp').addEventListener('input',e=>{
  e.target.value=e.target.value.replace(/\D/g,'').slice(0,8);check();
});
function check(){
  const v=$('exp').value;
  $('done').disabled=!($('name').value.trim()||draft.img||draft.cat)||!(v===''||v.length===8);
}

/* ---------- 사진 ---------- */
function openPicker(id){
  const i=$(id);i.value='';
  try{i.click()}catch(e){toast('사진을 열 수 없습니다')}
}
$('bCam').onclick=()=>openPicker('fCam');
$('bAlb').onclick=()=>openPicker('fAlb');
$('fCam').onchange=e=>pick(e.target.files&&e.target.files[0]);
$('fAlb').onchange=e=>pick(e.target.files&&e.target.files[0]);

function pick(f){
  if(!f)return;
  shrink(f).then(url=>{
    draft.img=url;$('prev').src=url;$('prev').style.display='block';
    check();recognize(url);
  }).catch(()=>toast('사진을 읽지 못했습니다'));
}
function shrink(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej();
    r.onload=()=>{
      const raw=r.result,im=new Image();
      im.onerror=()=>res(raw);
      im.onload=()=>{
        try{
          const m=340,s=Math.min(1,m/Math.max(im.width,im.height));
          const cv=document.createElement('canvas');
          cv.width=Math.max(1,im.width*s|0);cv.height=Math.max(1,im.height*s|0);
          cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
          const out=cv.toDataURL('image/jpeg',.62);
          res(out&&out.length>200?out:raw);
        }catch(e){res(raw)}
      };
      im.src=raw;
    };
    r.readAsDataURL(file);
  });
}

/* ---------- 사진으로 품목 알아내기 ---------- */
async function recognize(url){
  const s=$('aiStat');
  if(!WORKER&&!HAS_WS){s.textContent='';return}
  s.textContent='사진 보는 중…';
  const b64=url.split(',')[1];
  const mt=(url.match(/^data:(image\/[a-z+]+);/)||[])[1]||'image/jpeg';
  try{
    let j;
    if(WORKER){
      const r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({image:b64,media_type:mt})});
      j=await r.json();
      if(!r.ok||j.error)throw 0;
    }else{
      const list=CATS.map(c=>c.k).join(', ');
      const r=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:mt,data:b64}},
          {type:'text',text:'이 사진 속 식품이 무엇인지 알려줘. 포장에 제품명이 있으면 그 이름을, 없으면 생김새로 추정한 한국어 이름을 써줘. JSON 객체 하나만 출력해. {"name":"12자 이내","cat":"'+list+' 중 하나","icon":"이모지 한 글자","days":냉장 보관 가능 일수 정수,"sure":0~1 소수} 식품이 아니면 name을 빈 문자열로.'}
        ]}]})
      });
      const d=await r.json();
      const t=(d.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('');
      j=JSON.parse(t.replace(/```json|```/g,'').trim());
    }
    if(!j.name){s.textContent='식품으로 보이지 않습니다';return}

    if(!$('name').value)$('name').value=j.name;
    if(!draft.cat){
      const hit=[...$('cats').children].find(x=>x.textContent.endsWith(j.cat));
      if(hit)hit.click();
    }
    if(j.icon&&!draft.icon){
      draft.icon=j.icon;
      pressOnly($('icons'),[...$('icons').children].find(x=>x.textContent===j.icon));
    }
    if(Number.isInteger(j.days)&&j.days>0&&!$('exp').value)$('exp').value=plus(j.days);
    check();
    s.textContent=(j.sure!==undefined&&j.sure<0.6)
      ? `${j.name} 같습니다. 확인해주세요`
      : `${j.name} 으로 채웠습니다`;
  }catch(e){
    s.textContent='알아보지 못했습니다. 직접 적어주세요';
  }
}

/* ---------- 토스트 ---------- */
let tt=null;
function toast(m,undo){
  $('tmsg').textContent=m;
  const a=$('tact');
  a.hidden=!undo;
  a.onclick=undo?()=>{undo();hideToast()}:null;
  $('toast').classList.add('on');
  clearTimeout(tt);tt=setTimeout(hideToast,undo?5000:2000);
}
function hideToast(){$('toast').classList.remove('on')}

load();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
